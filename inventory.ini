# ── Local connection (auto-detects current user) ──────────────────────────────
# Used by Jenkins pipeline via: ansible-playbook -i inventory.ini deploy.yml
[local]
localhost ansible_connection=local

# ── Jenkins user (explicit) ───────────────────────────────────────────────────
# Use with: ansible-playbook -i inventory.ini deploy.yml -l jenkins_user
[jenkins_user]
localhost ansible_connection=local ansible_user=jenkins

# ── System user (shikhar) ─────────────────────────────────────────────────────
# Use with: ansible-playbook -i inventory.ini deploy.yml -l shikhar_user
[shikhar_user]
localhost ansible_connection=local ansible_user=shikhar
